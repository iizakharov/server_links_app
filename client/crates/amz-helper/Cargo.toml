[package]
name = "amz-helper"
description = "AMneZinu privileged helper: owns the tunnel, talks to the app over a local socket"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
amz-core = { path = "../amz-core" }
amz-ipc = { path = "../amz-ipc" }
amz-tunnel = { path = "../amz-tunnel" }
anyhow = "1"
serde_json.workspace = true
ctrlc = { version = "3", features = ["termination"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
  "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Console", "Win32_System_IO", "Win32_System_SystemInformation"] }
serde.workspace = true

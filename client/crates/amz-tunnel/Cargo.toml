[package]
name = "amz-tunnel"
description = "AMneZinu: amneziawg-go (go/libawg) linked into Rust, plus OS network setup"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
amz-core = { path = "../amz-core" }
amz-ipc = { path = "../amz-ipc" }
anyhow = "1"
hickory-resolver = "0.24.4"
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
serde_json.workspace = true

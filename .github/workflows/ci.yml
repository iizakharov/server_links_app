name: ci
on: [push, pull_request]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: golden fixtures are up to date
        run: python -m tests.golden.gen && git diff --exit-code client/fixtures

  rust:
    strategy:
      matrix: { os: [ubuntu-latest, macos-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: client } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: actions/setup-go@v5
        with: { go-version-file: client/go/libawg/go.mod, cache-dependency-path: client/go/libawg/go.sum }
      # Windows: tunnel/helper/CLI come in P5 (named pipe, wintun); core and SSH operations are checked already
      - if: runner.os == 'Windows'
        run: cargo clippy -p amz-core -p amz-remote --all-targets -- -D warnings && cargo test -p amz-core -p amz-remote
      - if: runner.os != 'Windows'
        run: cargo clippy --all-targets -- -D warnings
      - if: runner.os != 'Windows'
        run: cargo test
